<ion-header>
  <ion-toolbar>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="loading" class="loading"><ion-spinner name="crescent" /></div>

  <ng-container *ngIf="!loading && user">
    <div class="profile-hero">
      <ion-avatar class="profile-avatar">
        <img *ngIf="user.profilePicture" [src]="user.profilePicture" />
        <div *ngIf="!user.profilePicture" class="avatar-placeholder">{{ user.name[0] }}</div>
      </ion-avatar>
      <ion-button fill="clear" size="small" (click)="uploadPicture()">Change Photo</ion-button>
      <ion-badge [color]="user.role === 'critic' ? 'warning' : 'medium'">
        {{ user.role | titlecase }}
      </ion-badge>
    </div>

    <div class="stats">
      <div class="stat-box">
        <span class="stat-value">{{ user.createdAt | date:'yyyy' }}</span>
        <span class="stat-label">Since</span>
      </div>
    </div>

    <!-- Editable info card -->
    <ion-card class="info-card">
      <ion-card-content>
        <ng-container *ngIf="!editMode">
          <ion-item lines="full" (click)="startEdit()" button>
            <ion-label>
              <p>Name</p>
              <h3>{{ user.name }}</h3>
            </ion-label>
          </ion-item>
          <ion-item lines="none" (click)="startEdit()" button>
            <ion-label>
              <p>Email</p>
              <h3>{{ user.email }}</h3>
            </ion-label>
          </ion-item>
        </ng-container>

        <ng-container *ngIf="editMode">
          <ion-item lines="full">
            <ion-input label="Name" label-placement="floating" [(ngModel)]="editName" />
          </ion-item>
          <ion-item lines="none">
            <ion-input label="Email" label-placement="floating" type="email" [(ngModel)]="editEmail" />
          </ion-item>
          <div class="edit-actions">
            <ion-button fill="outline" (click)="cancelEdit()">Cancel</ion-button>
            <ion-button (click)="saveEdit()">Save</ion-button>
          </div>
        </ng-container>
      </ion-card-content>
    </ion-card>

    <div class="actions">
      <ion-button expand="block" fill="outline" (click)="switchRole()">
        Switch to {{ user.role === 'critic' ? 'User' : 'Critic' }}
      </ion-button>
      <ion-button expand="block" color="danger" fill="clear" (click)="logout()">
        Log Out
      </ion-button>
    </div>
  </ng-container>
</ion-content>
